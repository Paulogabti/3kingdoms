[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-dialog-translator-ptbr"
version = "0.1.0"
description = "Ferramenta local para traduzir diálogos de jogos para PT-BR preservando estrutura."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40,<3",
  "streamlit>=1.35,<2",
  "python-dotenv>=1.0.1,<2",
  "pydantic>=2.7,<3",
  "pandas>=2.2,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
